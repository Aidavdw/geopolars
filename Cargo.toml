[workspace]
resolver = "2"
members = ["geopolars"]
# The polars checkout patched in below is its own workspace. Without this,
# cargo makes path dependencies under this directory members of ours.
exclude = [".polars"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Keep every polars-* crate on the SAME minor version. Mixing them (e.g. polars
# 0.55 with polars-plan 0.54) compiles into two incompatible copies of the core
# types and fails with confusing trait errors.
polars = { version = "0.55", default-features = false }
polars-core = { version = "0.55", default-features = false }
polars-arrow = { version = "0.55", default-features = false }

# pyo3-polars is versioned INDEPENDENTLY of polars. 0.28 is the release built
# against polars 0.55 / pyo3 0.29. Bump all three together, never one alone.
pyo3-polars = { version = "0.28" }
pyo3 = { version = "0.29" }

serde = { version = "1.0.188", features = ["derive", "rc"] }

# Full debuginfo for all of polars statically linked into one cdylib produces an
# ~800MB artifact. Line tables are enough for backtraces and keep it sane.
[profile.dev]
debug = "line-tables-only"

# A plugin is a cdylib loaded into the polars process: build it optimized or the
# FFI hop costs more than the work it does.
[profile.release]
lto = "thin"
codegen-units = 1

# We build agains a specific polars commit (see the makefile).
# Python polars is build from the same tree.
[patch.crates-io]
polars = { path = ".polars/crates/polars" }
polars-arrow = { path = ".polars/crates/polars-arrow" }
polars-core = { path = ".polars/crates/polars-core" }
polars-ffi = { path = ".polars/crates/polars-ffi" }
polars-lazy = { path = ".polars/crates/polars-lazy" }
polars-plan = { path = ".polars/crates/polars-plan" }
polars-utils = { path = ".polars/crates/polars-utils" }
pyo3-polars = { path = ".polars/pyo3-polars/pyo3-polars" }
pyo3-polars-derive = { path = ".polars/pyo3-polars/pyo3-polars-derive" }
